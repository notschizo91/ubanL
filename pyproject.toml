[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ubanl"
version = "0.1.0"
description = "Segment large STL models into printable pieces with self-aligning connectors"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "trimesh>=4.10",
    "manifold3d>=2.5",
    "shapely>=2.0",
    "networkx>=3.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "rtree>=1.0",
    "lxml>=4.9",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
fast = ["fast-simplification>=0.1.7"]
dev = ["pytest>=7.4", "httpx>=0.27"]

[tool.setuptools.package-data]
ubanl = ["webui/*.html", "webui/vendor/**/*"]

[project.scripts]
ubanl = "ubanl.cli:main"

[tool.setuptools.packages.find]
include = ["ubanl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
